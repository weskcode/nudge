[package]
name = "nudge"
version = "1.0.5"
edition = "2021"
rust-version = "1.77"
description = "Firm but gentle periodic reminders, from your system tray"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
# the versions Tauri already uses, so nothing new is downloaded or built
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSAttributedString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSFont", "NSColor", "NSParagraphStyle", "NSText", "NSAttributedString"] }

[dependencies.tauri-plugin-autostart]
version = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
