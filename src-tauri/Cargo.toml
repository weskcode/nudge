[package]
name = "nudge"
version = "1.0.5"
edition = "2021"
rust-version = "1.77"
description = "Firm but gentle periodic reminders, from your system tray"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[dependencies.tauri-plugin-autostart]
version = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
