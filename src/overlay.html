<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Nudge</title>
</head>
<body id="overlay-body">
  <!-- a nudge's symbol (index.html has the same set) -->
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="s-figure" viewBox="0 0 24 24"><circle cx="13" cy="4" r="1.8"/><path d="M9 21l2.5-6 2.5 2v4M7.5 11.5l2-3.5 4 1 2.5 3 2.5.5M11.5 15l1-6"/></symbol>
    <symbol id="s-drop" viewBox="0 0 24 24"><path d="M12 3.5s-6 6.4-6 10.8a6 6 0 0 0 12 0C18 9.9 12 3.5 12 3.5z"/></symbol>
    <symbol id="s-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="s-breath" viewBox="0 0 24 24"><path d="M3.5 8.5h10.5a2.5 2.5 0 1 0-2.5-2.5M3.5 12h15a2.5 2.5 0 1 1-2.5 2.5M3.5 15.5h7"/></symbol>
    <symbol id="s-pill" viewBox="0 0 24 24"><g transform="rotate(-45 12 12)"><rect x="3" y="8.5" width="18" height="7" rx="3.5"/><path d="M12 8.5v7"/></g></symbol>
    <symbol id="s-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14zM10 20.5h4"/></symbol>
  </svg>
  <div id="overlay" role="alertdialog" aria-labelledby="overlay-text">
    <div class="reminder">
      <div class="glyph" aria-hidden="true">
        <svg class="figure" viewBox="0 0 24 24"><use id="glyph-symbol" href="#s-figure"/></svg>
        <svg class="ring" viewBox="0 0 90 90" hidden><circle class="track" cx="45" cy="45" r="43"/><circle class="progress" cx="45" cy="45" r="43"/></svg>
      </div>
      <h1 id="overlay-text"></h1>
      <p id="overlay-idea" hidden></p>
      <!-- empty rather than hidden, so VoiceOver announces a nudge that joins -->
      <p id="overlay-also" class="also-line" aria-live="polite"></p>
      <div class="overlay-actions">
        <button id="snooze" class="pill glass" type="button" hidden></button>
        <button id="done" class="pill primary" type="button">Done</button>
      </div>
      <p id="overlay-hint">or press any key</p>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
