<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Nudge Settings</title>
</head>
<body>
  <div id="settings">
    <h1>Nudge</h1>
    <section>
      <h2>Interval</h2>
      <div class="presets">
        <button data-minutes="15">15m</button>
        <button data-minutes="30">30m</button>
        <button data-minutes="45">45m</button>
        <button data-minutes="60">1h</button>
        <button data-minutes="90">1h30</button>
      </div>
      <label>custom minutes
        <input id="custom-minutes" type="number" min="1" step="1" />
      </label>
    </section>
    <section>
      <h2>Reminder</h2>
      <label>message
        <input id="message" type="text" />
      </label>
    </section>
    <section>
      <h2>Behavior on wake</h2>
      <label><input id="enabled-on-wake" type="checkbox" /> enable reminders on wake</label>
      <label><input id="reset-on-wake" type="checkbox" /> reset the timer on wake</label>
    </section>
    <section>
      <h2>Sound</h2>
      <label><input id="play-sound" type="checkbox" /> play a soft chime when a reminder shows</label>
    </section>
    <section>
      <h2>Startup</h2>
      <label><input id="launch-at-login" type="checkbox" /> launch at login</label>
    </section>
    <section>
      <h2>Counters</h2>
      <p id="counter-line"></p>
      <button id="reset-counters">Reset counters</button>
    </section>
    <footer>inspired by <a href="https://github.com/brettferdosi/remindful">remindful</a></footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
